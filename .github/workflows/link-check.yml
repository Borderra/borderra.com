name: Link Check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check source links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 6
            --max-retries 2
            --retry-wait-time 2
            --timeout 20
            --accept 200,204,206,301,302,403,429
            README.md
            docs/**/*.mdx
            src/**/*.tsx
            docusaurus.config.ts
          fail: true
